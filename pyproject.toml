[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vocabatron"
version = "0.3.0"
description = "Local, source-faithful crossword generation and independent PDF verification"
requires-python = ">=3.12,<3.14"
dependencies = [
  "docling-slim[convert-core,format-pdf,models-local,feat-ocr-rapidocr-onnx]==2.130.0",
  "torch==2.14.0+cpu",
  "torchvision==0.29.0+cpu",
  "rapidocr==3.9.2",
  "onnxruntime==1.30.0",
  "ortools>=9.12,<10",
  "pdfplumber>=0.11,<0.12",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "pydantic>=2.11,<3",
  "pypdfium2>=4.30,<6",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "apsw>=3.51.3.0,<4",
  "psutil>=7,<8",
]

[project.scripts]
vocabatron = "vocabatron.cli:main"
vocabatron-web = "vocabatron.app.api:main"
vocabatron-worker = "vocabatron.app.cli:worker_main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "build>=1.2,<2",
    "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vocabatron"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/frontend", "/deploy", "/AGENTS.md", "/README.md", "/pyproject.toml", "/uv.lock", "/config.example.json", "/.gitignore"]
exclude = ["/frontend/node_modules", "/frontend/dist", "/frontend/test-results", "/frontend/playwright-report", "/Outputs", "/.private", "/.cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.cache/pytest"
markers = ["private: explicitly enabled real local integration"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
